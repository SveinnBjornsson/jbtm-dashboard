<style>
:root{--navy:#1F3864;--orange:#ED7D31;--line:#d9dee8;--bg:#f6f8fc;--grey:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;

p{font-size:12.5px;color:var(--grey);margin:0 0 18px}
input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
input:focus{outline:2px solid #2E5496;border-color:#2E5496}
button{width:100%;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
button:hover{background:#2E5496}
button:disabled{background:#9aa3b0;cursor:wait}
.err{color:#C0392B;font-size:12px;min-height:16px;margin:8px 0 0;font-weight:600}
.foot{font-size:10.5px;color:var(--grey);margin-top:16px;text-align:center}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:P.iter,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
  return new TextDecoder().decode(pt);
}
async function attempt(pw,silent){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true; if(!silent){btn.textContent='Unlocking…';}
  try{
    const html=await unlock(pw);
    try{sessionStorage.setItem('s2f_gate_pw',pw);}catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled=false; btn.textContent='Unlock';
    if(!silent){err.textContent='Wrong password — please try again.'; document.getElementById('pw').select();}
  }
}
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  if(pw) attempt(pw,false);
});
try{const s=sessionStorage.getItem('s2f_gate_pw'); if(s) attempt(s,true);}catch(e){}
